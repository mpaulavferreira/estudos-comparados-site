# Painel de edição (Pages CMS: https://pagescms.org). Quem edita entra por convite, sem ver código.
# Regras de dados também valem aqui: no máximo 3 falas por país, sem nome/cargo/unidade; fotos até 400 KB.
media:
  input: public/media
  output: /media
content:
  - name: paises-pt
    label: "Países (português)"
    type: collection
    path: src/content/paises/pt
    format: yaml-frontmatter
    filename: "{fields.pais}.md"
    fields:
      - { name: pais, label: País, type: select, required: true, options: { values: [angola, argentina, brasil, cabo-verde, chile, colombia, espanha, guine-bissau, mexico, mocambique, peru, portugal, sao-tome-e-principe] } }
      - { name: resumo, label: "Frase de abertura (até 220 caracteres)", type: string, pattern: { regex: "^.{0,220}$", message: "Até 220 caracteres" } }
      - { name: retrato, label: "Retrato rápido do país e do sistema de saúde", type: text }
      - { name: coleta, label: Coleta, type: select, default: concluida, options: { values: [concluida, em-andamento] } }
      - { name: nivelMapa, label: "No mapa, mostrar por", type: select, default: municipio, options: { values: [municipio, regiao] } }
      - name: universidade
        label: Universidade parceira
        type: object
        fields:
          - { name: nome, label: Nome, type: string }
          - { name: site, label: Site, type: string }
          - { name: logo, label: Logo, type: image }
      - name: falas
        label: "Falas anônimas (máximo 3, sem nome, cargo ou unidade)"
        type: object
        list: { max: 3 }
        fields:
          - { name: texto, label: "Trecho curto (até 280 caracteres)", type: text, required: true }
      - name: fotos
        label: Fotos do diário de viagem
        type: object
        list: true
        fields:
          - { name: src, label: "Foto (até 400 KB)", type: image, required: true }
          - { name: alt, label: "O que aparece na foto (para quem não enxerga)", type: string, required: true }
          - { name: legenda, label: Legenda, type: string }
          - { name: autorizada, label: "Tem pessoa identificável e há autorização de imagem", type: boolean }
      - { name: rascunho, label: "Rascunho (não aparece no site)", type: boolean, default: true }
      - { name: body, label: "Diário de viagem (relato curto em primeira pessoa)", type: rich-text }
